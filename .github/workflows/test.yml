name: Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: Build the plugin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: bash scripts/package.sh

      - name: Check that every file of the plugin is in the package
        run: |
          set -euo pipefail
          archive="dist/io.github.xinmin.iina-sub.iinaplgz"
          for file in Info.json main.js i18n.js state.js config.js player.js cache.js ui.js \
                      session.js setup.js commands.js srt.js zh.js script.js watchdog.js \
                      worker.js engines.js decoder.js models.js pref.html sidebar.html \
                      README.md README.zh-CN.md TESTING.md docs/screenshot.png \
                      docs/OPENCC-LICENSE.txt LICENSE; do
            if ! unzip -Z1 "$archive" | grep -qx "$file"; then
              echo "::error::$file is missing from the package"
              exit 1
            fi
          done
          echo "the package holds every file"

      - name: Check that the helper in the plugin and the one in the repository are the same
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          source = open("tools/vina.swift", encoding="utf-8").read()
          plugin = open("decoder.js", encoding="utf-8").read()
          match = re.search(r"const SWIFT_SOURCE = String\.raw`(.*?)`;", plugin, re.S)
          if not match:
              print("::error::the source of the helper is not in decoder.js")
              sys.exit(1)
          if match.group(1) != source:
              print("::error::tools/vina.swift and decoder.js hold different helpers")
              sys.exit(1)
          print("the two helpers are the same")
          PY

      - name: Check that the speech recognition program still compiles
        run: |
          set -euo pipefail
          # The bundle is built the way the release builds it, so a change in
          # the sources that does not compile is caught here and not by a
          # user whose machine has no Homebrew.
          bash scripts/build-whisper.sh "$RUNNER_TEMP/whisper"
          cd "$RUNNER_TEMP/whisper"
          unzip -q iina-sub-whisper-macos.zip -d unpacked
          ./unpacked/whisper-cli --help > /dev/null
          echo "the program builds and runs"

      - name: Check that the helper still compiles
        run: |
          set -euo pipefail
          swiftc -O tools/vina.swift -o /tmp/vina-ci
          /tmp/vina-ci --duration /dev/null || true
          echo "the helper compiles"
